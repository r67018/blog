<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog Admin Editor | ryosei's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://r67018.com/assets/css/iceberg.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
  <style>
    :root {
      --bg-primary: var(--bg, #161821);
      --bg-secondary: var(--bg, #161821);
      --bg-tertiary: color-mix(in srgb, var(--panel, #1e2132) 65%, var(--line, #3e445e) 35%);
      --bg-input: var(--bg-alt, #0f1117);
      --border: var(--line, #3e445e);
      --border-subtle: color-mix(in srgb, var(--bg, #161821) 70%, var(--line, #3e445e) 30%);
      --border-focus: var(--accent, #89b8c2);
      --text-primary: var(--text, #c6c8d1);
      --text-secondary: var(--text-bright, #d2d4de);
      --text-muted: var(--muted, #6b7089);
      --accent: var(--iceberg-cyan, #89b8c2);
      --accent-hover: var(--iceberg-blue, #84a0c6);
      --accent-dim: color-mix(in srgb, var(--iceberg-cyan, #89b8c2) 18%, transparent);
      --success: var(--iceberg-green, #b4be82);
      --warning: var(--iceberg-orange, #e2a478);
      --danger: var(--iceberg-red, #e27878);
      --danger-hover: color-mix(in srgb, var(--iceberg-red, #e27878) 85%, var(--text-bright, #d2d4de));
      --radius: 8px;
      --font-sans: var(--font-base, "JetBrains Mono", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      --font-mono: var(--font-base, "JetBrains Mono", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      text-autospace: normal;
    }

    code, pre, kbd, samp {
      text-autospace: no-autospace;
    }

    .cjk-space {
      display: inline-block;
      width: 0.22em;
      pointer-events: none;
      user-select: none;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    /* Layout */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .status-badge.dirty {
      color: var(--warning);
    }
    .status-badge.saved {
      color: var(--success);
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-height: 0;
    }

    .sidebar-header {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg-input);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: background 0.15s ease;
    }
    .search-input:focus {
      background: color-mix(in srgb, var(--panel, #1e2132) 70%, var(--bg-input) 30%);
    }

    .post-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .post-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 9px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 2px;
      transition: background-color 0.15s ease;
    }
    .post-item:hover {
      background: color-mix(in srgb, var(--panel, #1e2132) 60%, transparent);
    }
    .post-item.active {
      background: var(--accent-dim);
    }
    .post-item.active .post-item-title {
      color: var(--accent);
    }

    .post-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-item-meta {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Main Editor Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-primary);
    }

    .draft-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--warning) 15%, transparent);
      color: var(--warning);
      font-size: 13px;
      flex-shrink: 0;
    }
    .draft-banner-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .meta-panel {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .col-span-6 { grid-column: span 6; }
    .col-span-4 { grid-column: span 4; }
    .col-span-3 { grid-column: span 3; }
    .col-span-12 { grid-column: span 12; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-prefix {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      border: none;
      padding: 6px 8px;
      border-radius: 6px 0 0 6px;
      white-space: nowrap;
    }

    .input-with-prefix {
      border-radius: 0 6px 6px 0 !important;
    }

    .text-input {
      width: 100%;
      padding: 6px 10px;
      background: var(--bg-input);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      color-scheme: dark;
      transition: background 0.15s ease;
    }
    .text-input:focus {
      background: color-mix(in srgb, var(--panel, #1e2132) 70%, var(--bg-input) 30%);
    }
    .text-input.mono {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .meta-options {
      margin-top: 10px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Toolbar */
    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tool-btn {
      padding: 4px 8px;
      background: color-mix(in srgb, var(--panel, #1e2132) 75%, transparent);
      border: none;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-primary);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tool-btn:hover {
      background: var(--bg-tertiary);
      color: var(--accent);
    }

    .view-tabs {
      display: flex;
      background: var(--bg-input);
      border: none;
      border-radius: 6px;
      padding: 2px;
    }
    .view-tab {
      padding: 4px 10px;
      font-size: 12px;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .view-tab.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Split Editor & Preview */
    .editor-panes {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .pane-editor, .pane-preview {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .pane-editor {
      padding: 0;
      border-right: 1px solid var(--border-subtle);
      position: relative;
    }

    .pane-editor.drag-over::after {
      content: "画像をドロップしてアップロード";
      position: absolute;
      inset: 8px;
      background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
      border: 2px dashed var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
    }

    .markdown-textarea {
      flex: 1;
      width: 100%;
      padding: 16px;
      background: var(--bg-primary);
      border: none;
      border-radius: 0;
      resize: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .pane-preview {
      overflow-y: auto;
      padding: 20px 24px;
      background: var(--bg-primary);
    }

    .editor-panes[data-mode="write"] .pane-preview { display: none; }
    .editor-panes[data-mode="write"] .pane-editor { border-right: none; padding: 0; }
    .editor-panes[data-mode="preview"] .pane-editor { display: none; }

    /* Preview Typography (Minimal Mistakes dark inspired) */
    .preview-header {
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .preview-title {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.3;
    }
    .preview-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .preview-chip {
      background: var(--bg-input);
      padding: 1px 7px;
      border-radius: 4px;
      border: none;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      margin-top: 1.4em;
      margin-bottom: 0.6em;
      line-height: 1.35;
    }
    .markdown-body h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
    }
    .markdown-body p {
      margin: 0 0 1em;
      line-height: 1.75;
    }
    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 5px;
      margin-inline: 0.18em;
      border-radius: 4px;
    }
    .markdown-body pre {
      background: var(--bg-input);
      border: none;
      border-radius: 6px;
      padding: 12px 14px;
      overflow-x: auto;
    }
    .markdown-body pre code {
      background: transparent;
      padding: 0;
      margin-inline: 0;
    }
    .markdown-body blockquote {
      margin: 0 0 1em;
      padding: 4px 14px;
      border-left: 4px solid var(--accent);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
    }
    .markdown-body img {
      max-width: 100%;
      border-radius: 6px;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 1em;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 6px 10px;
    }
    .markdown-body th {
      background: var(--bg-tertiary);
    }

    /* Footer Action Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .bottom-left, .bottom-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      padding: 7px 13px;
      border-radius: 6px;
      border: none;
      background: color-mix(in srgb, var(--panel, #1e2132) 75%, transparent);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      text-decoration: none;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-sm {
      padding: 4px 9px;
      font-size: 12px;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg-input);
      font-weight: 700;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: var(--bg-input);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
    }
    .btn-danger:hover:not(:disabled) {
      background: color-mix(in srgb, var(--danger) 14%, transparent);
      color: var(--danger);
    }
    .btn-danger-solid {
      background: var(--danger);
      color: var(--bg-input);
      font-weight: 600;
    }
    .btn-danger-solid:hover:not(:disabled) {
      background: var(--danger-hover);
      color: var(--bg-input);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: color-mix(in srgb, var(--bg-input) 78%, transparent);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    #setup-modal {
      background: var(--bg-primary);
      backdrop-filter: none;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--panel, #1e2132);
      border: none;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 18px 18px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-footer {
      padding: 4px 18px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .help-box {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-input);
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      line-height: 1.6;
    }
    .help-box ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }

    .error-text {
      color: var(--danger);
      font-size: 12px;
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .divider-text::before, .divider-text::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      right: 16px;
      bottom: 64px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      max-width: 360px;
    }

    .toast {
      background: var(--bg-tertiary);
      border: none;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-size: 13px;
      line-height: 1.5;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    /* Mobile & Tablet */
    .mobile-sidebar-btn {
      display: none;
    }

    @media (max-width: 900px) {
      .mobile-sidebar-btn {
        display: inline-flex;
      }
      .sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.5);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .col-span-6, .col-span-4, .col-span-3 {
        grid-column: span 12;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell hidden" id="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="btn btn-sm mobile-sidebar-btn" id="toggle-sidebar-btn">記事一覧</button>
        <div class="brand">
          <span>Blog Admin</span>
        </div>
        <span class="status-badge" id="editor-status">未認証</span>
      </div>
      <div class="topbar-right">
        <a href="/" class="btn btn-sm">ブログへ戻る</a>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-actions">
            <button type="button" class="btn btn-primary btn-sm" id="new-post-btn" style="flex:1;">+ 新規記事</button>
            <button type="button" class="btn btn-sm" id="refresh-posts-btn" title="記事一覧を再取得">更新</button>
          </div>
          <input type="search" class="search-input" id="post-search-input" placeholder="記事を検索...">
        </div>
        <div class="post-list" id="post-list">
          <div style="padding: 14px; color: var(--text-muted); font-size: 12px;">認証後に記事一覧を読み込みます</div>
        </div>
      </aside>

      <!-- Editor Area -->
      <main class="main-area">
        <div class="draft-banner hidden" id="draft-banner">
          <span id="draft-banner-text">この投稿のローカル自動保存下書きがあります。</span>
          <div class="draft-banner-actions">
            <button type="button" class="btn btn-sm btn-primary" id="restore-draft-btn">下書きを復元</button>
            <button type="button" class="btn btn-sm" id="discard-draft-btn">破棄</button>
          </div>
        </div>

        <section class="meta-panel">
          <div class="meta-grid">
            <div class="field col-span-12">
              <label for="post-title">タイトル</label>
              <input type="text" class="text-input" id="post-title" placeholder="記事のタイトル">
            </div>

            <div class="field col-span-4">
              <label for="post-date">
                <span>日時 (JST)</span>
                <button type="button" class="btn btn-sm" id="now-date-btn" style="padding: 1px 6px; font-size: 11px;">現在時刻</button>
              </label>
              <input type="datetime-local" class="text-input mono" id="post-date">
            </div>

            <div class="field col-span-4">
              <label for="post-categories">カテゴリ</label>
              <select class="text-input" id="post-categories">
                <option value="">(未選択)</option>
                <option value="tech">tech</option>
                <option value="daily">daily</option>
              </select>
            </div>

            <div class="field col-span-4">
              <label for="post-tags">タグ (カンマ区切り)</label>

  <script>
    (() => {
      'use strict';

      // ============================================================

      const STORAGE_KEYS = {

      // ============================================================

      const state = {
        settings: {

        posts: [],

        previewImageUrls: new Map(), // repoPath -> objectUrl

      };

      // ============================================================
      // DOM References
      // ============================================================
      const dom = {
        appShell: document.getElementById('app-shell'),
        editorStatus: document.getElementById('editor-status'),
        draftStatus: document.getElementById('draft-status'),

        draftBanner: document.getElementById('draft-banner'),
        draftBannerText: document.getElementById('draft-banner-text'),

        discardDraftBtn: document.getElementById('discard-draft-btn'),

        postTitle: document.getElementById('post-title'),

        postCategories: document.getElementById('post-categories'),
        postTags: document.getElementById('post-tags'),
        postPublished: document.getElementById('post-published'),
        postToc: document.getElementById('post-toc'),
        nowDateBtn: document.getElementById('now-date-btn'),

        postBody: document.getElementById('post-body'),
        paneEditor: document.getElementById('pane-editor'),
        editorPanes: document.getElementById('editor-panes'),
        previewTitle: document.getElementById('preview-title'),
        previewMeta: document.getElementById('preview-meta'),
        previewBody: document.getElementById('preview-body'),
        uploadImageBtn: document.getElementById('upload-image-btn'),
        imageFileInput: document.getElementById('image-file-input'),

        savePostBtn: document.getElementById('save-post-btn'),
